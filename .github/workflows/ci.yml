# Test Case Manager — CI
#
# On every push to main and on every pull request, runs three gates in
# order:
#   1. Lint              — `npm run lint` (eslint on utils + middleware)
#   2. Unit tests        — `npm run test:unit` (Node `node:test`, < 2 s)
#   3. Cypress end-to-end — full 263-test suite against a Postgres service
#
# Cost: ~3–4 min per run on the GitHub-hosted ubuntu-latest runner. Free
# for public repos; private repos get 2,000 min/month on the free tier.
#
# Badges: once this is on main, the README badge
#   [![CI](https://github.com/<owner>/<repo>/actions/workflows/ci.yml/badge.svg)](...)
# will go green on every green run and red on every failure.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One job, three sequential gates. Lint and unit tests are cheap (~3 s
# combined) so they run unconditionally before Cypress, which is what
# we actually care about — they catch the cheap-to-detect classes of
# problem (lint regressions, broken pure-function logic) without making
# us wait for a full DB boot. The Cypress run is the slowest gate
# (~2–3 min) so it stays last.
jobs:
  cypress:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres-as-a-service. Health-checked via pg_isready so the next step
    # only runs once the DB is accepting connections.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tcm
          POSTGRES_PASSWORD: tcm
          POSTGRES_DB: tcm
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcm -d tcm"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      # Same DATABASE_URL shape the app uses locally. The host is
      # `localhost` because services run in the same network namespace.
      DATABASE_URL: postgresql://tcm:tcm@localhost:5432/tcm?schema=public
      JWT_SECRET: ci-secret-do-not-use-in-prod-1234567890
      ADMIN_EMAILS: cypress-admin@tcm.com
      PORT: 3001
      # Keep Cypress from trying to phone home for telemetry / cloud
      # recording on a CI machine.
      CYPRESS_CRASH_REPORTS: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is the deterministic equivalent of `npm install` for CI —
        # it uses package-lock.json exactly. Prisma's postinstall hook runs
        # `prisma generate` against prisma/schema.prisma, producing the
        # native client binary for the Ubuntu runner.
        run: npm ci

      - name: Lint
        # Tier1-PR-4. Catches the cheap-to-detect classes of regression
        # (unused vars, undefined refs, stylistic drift) before any test
        # runs. Runs over `utils/` and `middleware/` — the two top-level
        # source folders the server owns. Client-side TS is checked
        # separately by the build step if/when added.
        run: npm run lint

      - name: Unit tests
        # Tier1-PR-4. 152 Node `node:test` cases covering the pure-function
        # layer (cron parser, flakiness math, bcrypt timing, JWT alg
        # pinning, webhook signature, etc.). Runs without DB in < 2 s,
        # so it can fail fast without paying the boot + migrate cost.
        run: npm run test:unit

      - name: OpenAPI stale check
        # Tier3-PR-N. Re-generates docs/openapi.json to a temp file and
        # diffs it against the committed one. Fails loudly if a schema
        # changed without `npm run openapi` being re-run, instead of
        # silently shipping a drifted contract.
        run: npm run openapi:check

      - name: Apply Prisma migrations
        # `migrate deploy` is the non-interactive sibling of `migrate dev`:
        # it applies pending migrations and exits. No shadow DB needed, no
        # prompts — exactly what CI wants.
        run: npx prisma migrate deploy

      - name: Cypress run
        # cypress-io/github-action@v6 handles three things that would
        # otherwise be boilerplate:
        #   1. caches the Cypress binary between runs (~200 MB saved)
        #   2. starts `npm start` in the background
        #   3. waits for the health endpoint, then runs `cypress run`
        #      with Xvfb if needed for the chosen browser
        # On failure, screenshots + videos are uploaded as artifacts.
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: 'http://localhost:3001/health'
          wait-on-timeout: 60
          browser: electron
          record: false
          parallel: false
        env:
          DATABASE_URL: postgresql://tcm:tcm@localhost:5432/tcm?schema=public
          JWT_SECRET: ci-secret-do-not-use-in-prod-1234567890
          ADMIN_EMAILS: cypress-admin@tcm.com

  # Tier3-PR-M. The Postman collection is the second contract-style
  # gate (Cypress covers the same surface from a different angle);
  # this job gives the panel a "Postman runs in CI too" talking point
  # without slowing the main gate. Separate job so it has its own
  # postgres + server lifecycle — never competes with Cypress for
  # port 3001.
  newman:
    name: Postman (newman)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tcm
          POSTGRES_PASSWORD: tcm
          POSTGRES_DB: tcm
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcm -d tcm"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://tcm:tcm@localhost:5432/tcm?schema=public
      JWT_SECRET: ci-secret-do-not-use-in-prod-1234567890
      ADMIN_EMAILS: cypress-admin@tcm.com
      PORT: 3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Start server
        # Boot the API in the background. The wait-on step below
        # blocks until /health is green, then newman runs against it.
        run: |
          node index.js &
          echo $! > server.pid

      - name: Wait for /health
        # Polls until /health returns 200, then runs the collection.
        # Fail-fast after 60 s so a stuck boot doesn't burn the budget.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server failed to boot in 60s"; exit 1

      - name: Run Postman collection
        # Runs the full collection end-to-end. The collection's
        # prerequest script auto-registers a fresh user, so a fresh
        # DB is sufficient — no manual seed step.
        run: npm run newman -- --bail

      - name: Stop server
        if: always()
        # Tear down even on failure so the runner doesn't leak the
        # background process across cancellations.
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
